[project]
name = "offside-cli"
version = "0.1.0"
description = "Offside git pre-push referee CLI"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
]

[project.scripts]
offside = "offside.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["offside"]

[tool.uv]
dev-dependencies = [
  "pytest>=8.0",
]
