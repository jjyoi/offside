[project]
name = "offside-backend"
version = "0.1.0"
description = "Offside review backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "sse-starlette>=2.1",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "openai>=1.50",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
